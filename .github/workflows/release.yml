# 发布：推送 v<数字> 开头的版本标签（比如 v0.3.0）时，构建安装包并发布到 GitHub Releases。
# 发布是公开操作：发布前先在 CHANGELOG.md 写好这个版本改了什么，本机检查全过再推送标签。
# DeskMate 的「检查更新」读的就是这里发布的最新正式版本；SHA256SUMS.txt 用来校验下载的安装包。
name: Release

on:
  push:
    # 只认 v 加数字：声音模型的发布页标签 voice-chiaki-v1 也以 v 开头，用 'v*' 会误触发（实测在它上面白跑了一次然后失败）
    tags: ['v[0-9]*']

permissions:
  contents: write

# 脚本里有中文输出，Windows 构建机的 Python 默认不是 UTF-8
env:
  PYTHONUTF8: "1"

jobs:
  release:
    name: 构建并发布（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # 和 CI 共用同一份依赖缓存（以前各用各的，发布每次都从零编译所有依赖，是最慢的一步）；发布这边只读不存
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: win-build
          save-if: false
      - run: npm ci
      - name: 标签必须和程序版本一致
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "标签 ${GITHUB_REF_NAME} 和版本 v$v 不一致"; exit 1; }
      # 不再在这里重跑测试：推送前本机 `npm run check` 已经全过，推送到 main 的 CI 也会再跑一遍；
      # 这里重跑只是白白多花十来分钟（DECISIONS #66）。
      # 下面两个包放在发布页上，找不到就让发布失败（--require）：保证下载到的安装包和开发机上的一样
      - name: 放进千秋的 Q 版形象包
        run: python scripts/chibi/fetch_art.py --require
      - name: 放进千秋的预录语音包
        run: python scripts/voice/fetch_voice_pack.py --require
      - name: 构建安装包
        run: npx tauri build
      - name: 计算 SHA-256
        shell: bash
        working-directory: src-tauri/target/release/bundle/nsis
        run: sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: 更新说明（取自 CHANGELOG.md，只写改了什么）
        shell: bash
        run: python scripts/release_notes.py ${{ github.ref_name }} > notes.md
      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
