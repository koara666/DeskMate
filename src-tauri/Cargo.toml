[package]
name = "deskmate"
version = "0.4.1"
description = "常驻桌面的萌系 AI 伙伴"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "deskmate_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
# 开机自启（默认关闭）、全局快捷键：只在 Rust 端使用，不开放给前端
tauri-plugin-autostart = "2.7"
tauri-plugin-global-shortcut = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "process", "io-util", "fs"] }
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rusqlite = { version = "0.41", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
base64 = "0.22"
# HTTP：Windows 上用系统 TLS（schannel），体积小；读取系统代理设置（国内访问 Gemini/Claude 常需要代理）
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream", "http2", "system-proxy", "charset"] }
# API Key 存系统凭据管理器
keyring = { version = "3.6", features = ["windows-native", "apple-native"] }
tauri-plugin-notification = "2"
png = "0.18"
# 截图编码成 JPEG（纯 Rust、没有依赖；比 PNG 小三分之二，上传更快）
jpeg-encoder = "0.6"
# 校验更新安装包（tauri 本来就依赖它）
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_Graphics_Dwm",
] }
# 看屏幕时的隐私保护：UI Automation（焦点是不是密码框）、Windows 自带的文字识别（本地涂黑敏感文字）。
# tauri 本来就依赖 windows 0.62，这里只多开几个功能
windows = { version = "0.62", features = [
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Media_Ocr",
  "Graphics_Imaging",
  "Globalization",
  "Security_Cryptography",
  "Storage_Streams",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "unwind"

[profile.dev]
# 依赖用优化编译，开发时窗口和数据库更流畅；自己的代码保持快速增量编译
[profile.dev.package."*"]
opt-level = 1
